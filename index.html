<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hollow Wake</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#10170f;--ink:#e8e2c8;--moss:#6f9a4a;--hp:#c9473b;--gold:#e0b341;box-sizing:border-box}
*{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%;cursor:default}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;font-weight:700;text-shadow:0 2px 0 rgba(0,0,0,.8)}
.hl{display:flex;gap:8px;align-items:flex-start}
#av{width:52px;height:52px;border:3px solid #3a0b12;background:#0c0508 center/cover no-repeat;image-rendering:pixelated;border-radius:6px;display:grid;place-items:center;font-size:28px;box-shadow:inset 0 0 0 2px #a01828}
.hb{display:flex;flex-direction:column;gap:3px}
.hpbar{position:relative;width:min(230px,38vw);height:22px;border:3px solid #1a0a0e;border-radius:6px;background:#2a0d12;overflow:hidden}
.hpbar i{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(#e0414f,#a01828);transition:width .15s}
.hpbar span{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;color:#fff}
#sc{font-size:15px;letter-spacing:1px}
.xpbar{height:7px;width:min(230px,38vw);background:#10202e;border:2px solid #1a0a0e;border-radius:4px;overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:#5ab4ff}
#dbg{position:fixed;left:8px;top:96px;font:11px monospace;color:#9f9;background:rgba(0,0,0,.6);padding:4px 6px;white-space:pre;pointer-events:none;display:none}
.hc{text-align:center;background:rgba(10,6,8,.55);padding:4px 16px;border-radius:0 0 8px 8px;min-width:96px}
#wv{font-size:14px;letter-spacing:2px}
#tm{font-size:26px;line-height:1.1}
.hr{display:flex;gap:6px;align-items:center}
.cn{display:flex;align-items:center;gap:5px;background:rgba(10,6,8,.55);padding:4px 10px;border-radius:8px;font-size:15px}
.coin{width:16px;height:16px;border-radius:50%;background:radial-gradient(#ffe27a,#e0b341);border:2px solid #8a6a1a;display:inline-block}
#pz{pointer-events:auto;width:44px;height:44px;border:3px solid #a01828;background:#1a0a10;color:#fff;font-size:15px;border-radius:8px;cursor:pointer;text-shadow:none}
.bar{width:200px;height:16px;border:2px solid var(--ink);background:#2a1512}
.bar i{display:block;height:100%;width:100%;background:var(--hp)}
.stat{margin-top:6px}
#help{position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);font-size:13px;opacity:.75;pointer-events:none}
#bb{position:fixed;top:calc(env(safe-area-inset-top,0px) + 84px);left:50%;transform:translateX(-50%);width:min(420px,80vw);text-align:center;display:none;pointer-events:none;font-size:14px}
#bb .bar{width:100%;height:14px;margin-top:3px}
#bb .bar i{background:#a8442f}
#wbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:6px;pointer-events:none}
.wi{image-rendering:pixelated;image-rendering:crisp-edges;vertical-align:middle;max-width:100%}
.card .ic{min-height:56px;display:flex;align-items:center}
.slot{width:54px;height:54px;border:3px dashed #3a4a33;background:rgba(16,23,15,.8);display:grid;place-items:center;font-size:22px}
.slot.on{border-style:solid}
.slot{position:relative;overflow:hidden}
.slot .n{position:absolute;left:2px;top:0;font-size:10px;opacity:.7}
.slot .cd{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);height:0}
.slot.rdy{box-shadow:0 0 8px #e0b341}
#pause,#over,#inter,#camp{position:fixed;inset:0;display:none;place-items:center;background:rgba(8,12,7,.7)}
#pause.on,#over.on,#inter.on,#camp.on{display:grid}
#inter,#camp{place-items:start center;overflow:auto;padding:12px;background:rgba(8,12,7,.94)}
#shop,#hshop{width:min(960px,100%);padding:4px 4px 24px}
#shop h1,#hshop h1{margin:0;font-size:24px}
#shop header,.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0}
#shop p,#hshop p{margin:4px 0;font-size:14px}
.msg{color:var(--gold);min-height:18px}
#cards,#hcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:8px}
.card{border:3px solid #444;background:#18211a;padding:8px;display:flex;flex-direction:column;gap:4px;font-size:13px;min-height:150px}
.card .ic{font-size:28px}
.card small{opacity:.8;flex:1}
#shop button,#camp button,#over button,#pause button{font:inherit;cursor:pointer;background:var(--moss);color:#10170f;border:0;padding:6px 10px}
#shop button:disabled,#camp button:disabled{opacity:.35;cursor:default}
.build{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px;font-size:13px}
@media(max-width:640px){.build{grid-template-columns:1fr}}
.sr{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid #2b3a29;padding:3px 0}
.sr small{opacity:.65}
.go{margin-top:14px;padding:10px 22px!important;font-size:16px!important}
#camp{background:rgba(8,12,7,.5)}
#camp #hshop{background:rgba(12,18,10,.9);border:2px solid #3a4a33;padding:16px;margin-top:3vh;text-align:center}
#camp .card{text-align:left}
.menu{display:flex;flex-direction:column;gap:8px;max-width:320px;margin:12px auto}
.menu button{padding:12px!important;font-size:18px!important}
#over button,#pause button{margin:8px 4px 0}
button:hover:not(:disabled){filter:brightness(1.15);transform:translateY(-1px)}
.card{transition:transform .12s}.card:hover{transform:translateY(-2px)}
.sr.mrg{animation:mrg 1s infinite;background:rgba(224,179,65,.12)}
@keyframes mrg{50%{box-shadow:0 0 10px #e0b341}}
.sh{grid-column:1/-1;font-weight:700;letter-spacing:2px;color:var(--gold);margin-top:4px}
.lk{background:#2a3322!important;color:#e8e2c8!important;margin-top:4px;font-size:12px!important}
.mtip{color:var(--gold);font-size:12px;margin:2px 0}
#shop.mf{animation:mf .6s}
@keyframes mf{0%{background:rgba(255,255,255,.4)}100%{background:transparent}}
.bar i{transition:width .15s}
#inter{background:rgba(6,8,14,.66)}
#shopx{width:100%;max-width:1480px;margin:0 auto;font-family:'Pixelify Sans','Trebuchet MS',Verdana,sans-serif;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.7)}
.sx-top{position:relative;display:flex;justify-content:center;align-items:center;gap:18px;min-height:56px}
.sx-wave{font-size:clamp(15px,2vw,22px);color:#b8bcd0;letter-spacing:2px}
.sx-gold{display:flex;align-items:center;gap:8px;font-size:clamp(20px,3vw,32px);font-weight:700}
.sx-gold .coin{width:26px;height:26px}
#rr{position:absolute;right:0;top:0;background:linear-gradient(#b8f23c,#7ed321);color:#17420a;border:3px solid #3c7a12;border-radius:6px;font:700 clamp(15px,2vw,22px) 'Pixelify Sans','Trebuchet MS',sans-serif;padding:6px 14px;cursor:pointer;display:flex;gap:8px;align-items:center;text-shadow:none}
#rr:disabled{filter:grayscale(.8);opacity:.6;cursor:default}
.sx-main{display:grid;grid-template-columns:clamp(150px,15vw,225px) 1fr;gap:16px;margin-top:8px;align-items:start}
.sx-stats{background:rgba(10,12,18,.88);border:2px solid #3b4050;padding:10px}
.xport{display:block;width:64px;height:64px;margin:0 auto 8px;border:3px solid #6a7090;border-radius:6px;background:#0c0d12;image-rendering:pixelated}
.xhp{position:relative;height:18px;background:#3a2218;border:2px solid #1a0a0e;border-radius:4px;overflow:hidden;margin-bottom:4px}
.xhp i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#e0414f,#a01828)}
.xhp span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px}
.xscore{font-size:12px;text-align:center;margin-bottom:8px;opacity:.85}
.xs{display:flex;justify-content:space-between;font-size:clamp(11px,1.15vw,14px);padding:4px 0;letter-spacing:.5px}
.g{color:#5dff3a}.rd{color:#ff6a5a}
.sx-center{min-width:0}
#smsg{text-align:center;min-height:18px;color:#ffd24a;margin:0 0 6px;font-size:14px}
#cards{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(10px,2vw,34px);padding-top:14px}
.xc{position:relative;width:clamp(150px,16.5vw,232px);background:#2a2e3a;border:3px solid var(--rc,#9aa2c9);border-radius:8px;box-shadow:0 0 0 2px #1a1d26,inset 0 0 0 2px #3a3f50;padding:18px 10px 10px;display:flex;flex-direction:column;align-items:center;min-height:clamp(250px,28vw,330px)}
.xc.lock{border-color:#27e24d;box-shadow:0 0 0 2px #0a2a10,0 0 14px #27e24d88,inset 0 0 0 2px #1c5a2a;background:#1f3a2c}
.xc.sold{opacity:.4}
.xbadge{position:absolute;left:-14px;top:-16px;width:42px;height:42px;border-radius:50%;background:#7f87b3;border:3px solid #c8cce8;display:grid;place-items:center;font-size:22px;text-shadow:none;color:#fff}
.xc.lock .xbadge{background:#27e24d;border-color:#9dffb0}
.xname{font-size:clamp(14px,1.5vw,19px);font-weight:700;text-align:center;margin-bottom:6px}
.xicon{min-height:clamp(56px,6vw,84px);display:flex;align-items:center;justify-content:center}
.xemo{font-size:clamp(34px,4vw,54px);text-shadow:none}
.xemo.s{font-size:30px}
.xcat{font-size:clamp(12px,1.3vw,16px);font-weight:700;color:#f0a020;margin-top:4px;letter-spacing:1px}
.xcat.dim{color:#8f95b0;font-size:11px}
.xbody{width:100%;flex:1;font-size:clamp(11px,1.2vw,14px);margin:8px 0;line-height:1.5;text-align:left;padding:0 4px}
.xbody .note{font-size:11px;opacity:.7}
.xbuy,.xlock{width:92%;border-radius:5px;font:700 clamp(14px,1.5vw,18px) 'Pixelify Sans','Trebuchet MS',sans-serif;cursor:pointer;padding:5px 0;display:flex;gap:6px;justify-content:center;align-items:center;text-shadow:none}
.xbuy{background:linear-gradient(#b8f23c,#7ed321);border:3px solid #3c7a12;color:#17420a;margin-top:auto}
.xbuy:disabled{background:#59606a;border-color:#3a3f48;color:#a0a6b0;cursor:default}
.xlock{background:linear-gradient(#37e0fa,#16b8dc);border:3px solid #0a7a98;color:#fff;margin-top:6px;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.xlock.on{background:linear-gradient(#37fa6a,#16c846);border-color:#0a7a2a}
.sx-inv{display:grid;grid-template-columns:1fr 1.6fr;gap:16px;margin-top:22px}
.tab{display:inline-block;background:#6a56a8;border:3px solid #9a86d8;border-bottom:0;border-radius:6px 6px 0 0;padding:4px 18px;font-weight:700;letter-spacing:1px}
.panel{background:#4c3d7a;border:3px solid #8e7bd0;border-radius:0 6px 6px 6px;min-height:104px;padding:10px;display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start}
.xw{display:flex;flex-direction:column;align-items:center;gap:3px;width:92px}
.xt{position:relative;width:78px;height:78px;background:#2c2c36;border:3px solid #8a8aa0;border-radius:6px;display:grid;place-items:center}
.xt em{position:absolute;right:2px;bottom:0;font-size:11px;font-style:normal;background:#000a;padding:0 3px;border-radius:3px}
.xt.mrg{animation:mrg 1s infinite}
.xn{font-size:11px;text-align:center}
.mini{font:700 11px 'Pixelify Sans','Trebuchet MS',sans-serif;background:#7a5fd0;color:#fff;border:2px solid #b7a4f5;border-radius:4px;padding:2px 4px;cursor:pointer;width:100%;text-shadow:none}
.mini.sell{background:#a0432f;border-color:#e08a70}
.mini:disabled{opacity:.4;cursor:default}
.empty{opacity:.5}
#invnote{font-size:12px;color:#ffd24a;min-height:16px;margin-top:6px}
.sx-go{display:flex;flex-direction:column;align-items:flex-end;gap:6px;margin-top:16px}
.nw{font-size:clamp(14px,1.8vw,20px);letter-spacing:2px}
.gobtn{background:linear-gradient(#37e0fa,#16b8dc);border:4px solid #0a7a98;border-radius:6px;color:#fff;font:700 clamp(24px,3vw,36px) 'Pixelify Sans','Trebuchet MS',sans-serif;padding:6px 40px;cursor:pointer;text-shadow:0 3px 0 rgba(0,0,0,.4)}
#ires{text-align:center;font-size:13px;color:#ffd24a;margin:4px 0 0}
#shopx.mf{animation:mf .6s}
body.shop .hud,body.shop #wbar,body.shop #help,body.shop #bb{display:none}
@media(max-width:860px){.sx-main{grid-template-columns:1fr}.sx-stats{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.sx-stats #sph{grid-column:1/-1}.sx-inv{grid-template-columns:1fr}}
body.camp .hud,body.camp #wbar,body.camp #help,body.camp #bb{display:none}
#pause>div,#over>div{border:2px solid var(--moss);background:var(--bg);padding:24px 40px;text-align:center}
#pause h1,#over h1{margin:0 0 8px;font-size:28px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div class="hl"><div id="av"></div><div class="hb"><div class="hpbar"><i id="hp"></i><span id="hpt"></span></div><div class="xpbar"><i id="xpf"></i></div><div id="sc">SCORE 0</div></div></div>
  <div class="hc"><div id="wv">WAVE 1</div><div id="tm">60</div></div>
  <div class="hr"><div class="cn"><i class="coin"></i><b id="gold">0</b></div><div class="cn"><span>☠</span><b id="kl">0</b></div><button id="pz" onclick="togglePause()">❚❚</button></div>
</div>
<div id="dbg"></div>
<div id="bb"><span id="bn"></span><div class="bar"><i id="bh"></i></div></div>
<div id="camp"><div id="hshop"></div></div>
<div id="wbar"></div>
<div id="help">WASD mover · Ataque y apuntado automáticos · Esc pausa · M sonido</div>
<div id="pause"><div><h1>Pausa</h1><p>Esc para continuar</p><button onclick="state.paused=false;document.getElementById('pause').classList.remove('on')">Reanudar</button><button onclick="state.paused=false;document.getElementById('pause').classList.remove('on');toCamp()">Salir al Camp</button></div></div>
<div id="over"><div><h1 id="ot">Moriste</h1><p id="res"></p><p><b>Mejores partidas</b><br><span id="lb"></span></p><button onclick="retry()">Reintentar (R)</button><button onclick="toCamp()">Volver al Camp</button></div></div>
<div id="inter"><div id="shopx">
  <div class="sx-top"><div class="sx-wave" id="it"></div><div class="sx-gold"><i class="coin"></i><b id="gd">0</b></div><button id="rr" onclick="reroll()"></button></div>
  <p id="ires"></p>
  <div class="sx-main">
    <aside class="sx-stats"><div id="sph"></div><div id="bst"></div></aside>
    <section class="sx-center"><p id="smsg"></p><div id="cards"></div>
      <div class="sx-inv"><div><div class="tab">WEAPONS</div><div class="panel" id="invw"></div></div><div><div class="tab">ITEMS</div><div class="panel" id="invi"></div></div></div>
      <div id="invnote"></div></section>
  </div>
  <div class="sx-go"><div class="nw" id="nwv"></div><button class="gobtn" onclick="nextWave()">GO</button></div>
</div></div>
<script>
// ===== core/GameState =====
const state={paused:false,time:0};
// ===== player/PlayerStats =====
const stats={maxHP:100,damage:10,armor:0,attackSpeed:100,critRate:0,range:100,dodge:0,moveSpeed:100,engineering:0,luck:0,knockback:0};
const CAPS={critRate:90,dodge:75,moveSpeed:80}; // tope de bonus
// ===== maps/Map =====
const W=1600,H=1600; // arena cuadrada: 67% de las dimensiones anteriores (2400→1600 = 25×25 baldosas de 64); todo el juego usa W y H
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const obstacles=[]; // sin objetos con colisión: solo chocás con las paredes del borde
const grass=[],pebbles=[],flowers=[],forest=[],lights=[];
for(let i=0;i<490;i++)grass.push({x:rnd()*W,y:rnd()*H,s:3+rnd()*5});
for(let i=0;i<40;i++)pebbles.push({x:rnd()*W,y:rnd()*H,r:2+rnd()*4});
for(let i=0;i<31;i++)flowers.push({x:rnd()*W,y:rnd()*H,c:['#e0c24a','#d98ab0','#e8e2c8'][i%3]});
const patches=[],bushes=[],logs=[],mush=[];
for(let i=0;i<25;i++){ // manchas grandes, más densas hacia los bordes
  const sd=i%4,t=rnd()*(sd<2?W:H),d=rnd()*300;
  patches.push({x:sd===2?d:sd===3?W-d:t,y:sd===0?d:sd===1?H-d:t,rx:90+rnd()*140,ry:60+rnd()*90,c:i%5?'rgba(22,34,18,.38)':'rgba(80,100,50,.16)'});
}
for(let i=0;i<5;i++)patches.push({x:rnd()*W,y:rnd()*H,rx:80+rnd()*90,ry:50+rnd()*60,c:'rgba(80,100,50,.14)'});
for(let i=0;i<18;i++)bushes.push({x:rnd()*W,y:rnd()*H,r:8+rnd()*6});
for(let i=0;i<4;i++)logs.push({x:rnd()*W,y:rnd()*H,w:40+rnd()*30});
for(let i=0;i<13;i++)mush.push({x:rnd()*W,y:rnd()*H});
for(let i=0;i<5;i++)lights.push({x:rnd()*W,y:rnd()*H,r:160+rnd()*160});
for(let i=0;i<420;i++){ // bosque decorativo que rodea la arena, fuera de las paredes
  const x=-300+rnd()*(W+600),y=-300+rnd()*(H+600);
  if(x>-30&&x<W+30&&y>-30&&y<H+30)continue;
  forest.push({x,y,r:22+rnd()*12,type:rnd()<.85?'tree':'rock'});
}
forest.sort((a,b)=>a.y-b.y);
const hedge=[]; // borde de vegetación espesa (decorativo, fuera del área jugable)
for(let k=0;k<2;k++)for(let t=-60;t<=W+60;t+=34){
  const j=()=>(rnd()-.5)*10,off=-18-k*22+j(),mk=()=>({r:20+rnd()*9,f:rnd()<.45});
  hedge.push({x:t+j(),y:off,...mk()});hedge.push({x:t+j(),y:H-off,...mk()});
  hedge.push({x:off,y:t+j(),...mk()});hedge.push({x:W-off,y:t+j(),...mk()});
}
hedge.sort((a,b)=>a.y-b.y);
const SPAWNS=[{x:170,y:170},{x:W-170,y:170},{x:170,y:H-170},{x:W-170,y:H-170}]; // puntos de aparición en las esquinas
// ===== player/Player =====
const player={x:W/2,y:H/2,r:12,hp:stats.maxHP,aim:0};

// ===== enemies/EnemyDatabase =====
const BASE_HP=30; // tabla central: se ajusta sin tocar el código de combate (hp = BASE_HP × multiplicador de tipo)
const EnemyDB={ // arquetipos observados en el gameplay de referencia; cada uno es independiente (sprite, tamaño, velocidad, vida, daño, hitbox)
  skeleton:{hp:BASE_HP*.8,damage:5,moveSpeed:105,spdScale:.6,r:9,attackCooldown:.9,goldReward:1,scoreReward:10,behavior:'chaser',color:'#dcdcd2'},
  scorpion:{hp:BASE_HP*.7,damage:5,moveSpeed:125,spdScale:.8,r:9,attackCooldown:.9,goldReward:1,scoreReward:12,behavior:'lunge',color:'#c8873a'},
  greenPlant:{hp:BASE_HP*2,damage:8,moveSpeed:70,spdScale:.3,r:15,attackCooldown:1.1,goldReward:2,scoreReward:25,behavior:'chaser',range:300,shots:1,spread:0,pspeed:160,fireCd:1.1,shotSrc:'Espina',color:'#4fa04a'},
  purpleWolf:{hp:BASE_HP*2.8,damage:11,moveSpeed:118,spdScale:.4,r:17,attackCooldown:1,goldReward:3,scoreReward:35,behavior:'chaser',color:'#6a58b8'},
  purpleFlower:{hp:BASE_HP*1.3,damage:7,moveSpeed:55,spdScale:0,r:12,attackCooldown:1,goldReward:2,scoreReward:22,behavior:'ranged',range:300,shots:3,spread:.45,pspeed:160,fireCd:2.4,shotSrc:'Pétalo',color:'#a050d8'}
};
// ===== enemies/EnemyPool (objetos reutilizables) =====
const pool=Array.from({length:150},()=>({active:false}));
let coins=[],texts=[],swing=null;
const game={gold:0,score:0,kills:0,spawnT:0,dead:false,hitFlash:0,atkCD:0,auto:false,fireT:0,pulse:0,bossT:0,endT:0,bossDead:false,phase:'wave',goldEarned:0,cleared:0,wave:1,timeLeft:0};
const eprojs=[],eprojFree=[];game.xp=0;game.lvl=0;
// ===== enemies/EnemySpawner =====
function enemyFire(e,dt,dx,dy,dist){ // patrón de disparo según 'shots': 1 = un proyectil, 3 = abanico simultáneo (central hacia el jugador y uno a cada lado)
  e.sc-=dt;
  if(dist<e.range+60&&e.sc<=0){
    e.sc=e.fireCd*(.85+Math.random()*.3);startAttack(e,.5);

function pushEP(x,y,vx,vy,dmg,life,src){const q=eprojFree.pop()||{};q.x=x;q.y=y;q.vx=vx;q.vy=vy;q.dmg=dmg;q.life=life;q.src=src;q.owner='enemy';eprojs.push(q)}
function spawnSpot(){ // anillo alrededor de la pantalla: 50–150 unidades fuera del borde visible
  const hw=cv.width/2/ZOOM,hh=cv.height/2/ZOOM;
  for(let i=0;i<16;i++){
    const d=50+Math.random()*100,sd=Math.random()*4|0;let x,y;
    if(sd<2){x=cam.x+(Math.random()*2-1)*(hw+d);y=cam.y+(sd?1:-1)*(hh+d)}
    else{y=cam.y+(Math.random()*2-1)*(hh+d);x=cam.x+(sd===3?1:-1)*(hw+d)}
    if(x>40&&x<W-40&&y>40&&y<H-40)return {x,y};
  }
  for(let i=0;i<30;i++){ // si la cámara está en un borde: cualquier punto fuera de pantalla
    const x=60+Math.random()*(W-120),y=60+Math.random()*(H-120);
    if(Math.abs(x-cam.x)>hw+40||Math.abs(y-cam.y)>hh+40)return {x,y};
  }
  return {x:W/2,y:H/2};
}
function queueSpawn(type,elite){ // primero aparece la X roja; el enemigo llega al terminar el aviso

function hurtPlayer(raw,src){
  if(Math.random()*100<Math.min(stats.dodge,CAPS.dodge)){floatText(player.x,player.y-20,'Esquivó','#9cd');return}
  const dmg=Math.max(1,Math.round(raw*(1-stats.armor/(stats.armor+15))));
  player.hp-=dmg;game.hitFlash=.15;sfx('hurt');shake(7);game.vig=.45;floatText(player.x,player.y-20,'-'+dmg+(src?' '+src:''),'#f66',16);

    player.hp=0;showResults(false);
  }

function hitEnemy(e,dmg,crit,kb,ang,col){
  e.hp-=dmg;e.flash=crit?.16:.1;e.hitT=HIT_T;sfx(crit?'crit':'hit');
  burst(e.x,e.y-e.r*.5,crit?'#fd4':(col||'#fff'),crit?12:5,170);
  if(crit){shake(3);slashes.push({k:'ring',x:e.x,y:e.y-e.r*.5,t:.18,T:.18,c:'#fd4'})}else if(dmg>=40||kb>=14)shake(2);
  const kk=e.boss?.12:e.r>=18?.45:1;e.kx=Math.cos(ang)*(150+kb*10)*kk;e.ky=Math.sin(ang)*(150+kb*10)*kk;
  if(camp.dmgNums)floatText(e.x,e.y-e.r-6,dmg+(crit?'!':''),crit?'#fd4':'#fff',crit?22:dmg>=40?17:14);
  if(e.hp<=0)killEnemy(e);
}
const dying=[],spawnMarks=[]; // spawnMarks: avisos de aparición (X roja)
function killEnemy(e){
  e.active=false;game.kills++;game.score+=e.scoreReward;
  if(e.boss){bossDown(e);return}
  const big=e.r>=18;sfx('kill');burst(e.x,e.y,e.color,big?18:10,210);
  if(big){shake(3);sfx('boom');burst(e.x,e.y,'#fff',14,260)}
  if(dying.length<60){const d=EANIM[e.type]?.65:(big?.45:.28);dying.push({x:e.x,y:e.y-e.r*.4,r:e.r,color:e.color,t:d,T:d,big:big&&!EANIM[e.type],type:e.type,face:player.x>=e.x?1:-1})}
  if(coins.length<BAL.maxPickups){ // drops: oro, XP (separada) y a veces vida
    if(e.elite||big||Math.random()<BAL.coinChance)coins.push({x:e.x,y:e.y,v:e.goldReward});
    coins.push({x:e.x+(Math.random()-.5)*10,y:e.y+(Math.random()-.5)*10,v:Math.max(1,Math.round(e.scoreReward/10)),k:'xp'});
    if(Math.random()<(e.elite?BAL.hpDropElite:BAL.hpDrop))coins.push({x:e.x,y:e.y,v:1,k:'hp'});
  }
}
const xpNeed=l=>16+l*9;
function gainXP(v){
  game.xp+=v;let up=0;
  while(game.xp>=xpNeed(game.lvl)){game.xp-=xpNeed(game.lvl);game.lvl++;up++}
  if(up){recalcStats();floatText(player.x,player.y-34,'¡NIVEL '+(game.lvl+1)+'!','#5ab4ff',18);sfx('win');burst(player.x,player.y-10,'#5ab4ff',14,200)}
}
function collectPickups(dt,all){ // oro, XP y vida: se atraen al jugador
  for(let i=coins.length-1;i>=0;i--){
    const c=coins[i],dx=player.x-c.x,dy=player.y-c.y,d=Math.hypot(dx,dy)||1;
    if(all||d<(c.k==='xp'?110:90)){const sp=all?900:420;c.x+=dx/d*sp*dt;c.y+=dy/d*sp*dt}
    if(d<player.r+6){
      if(c.k==='xp')gainXP(c.v);
      else if(c.k==='hp'){const h=Math.max(3,Math.round(stats.maxHP*.06));player.hp=Math.min(stats.maxHP,player.hp+h);floatText(player.x,player.y-26,'+'+h+' HP','#7de07d')}
      else{game.gold+=c.v;game.goldEarned+=c.v;sfx('coin');floatText(player.x,player.y-24,'+'+c.v,'#e0b341')}
      coins[i]=coins[coins.length-1];coins.pop();
    }
  }
}

  const R=effRange(d),mode=d.tg||'near';let best=null,bs=-1e9;
  for(const e of pool){
    if(!e.active)continue;
    const dd=Math.hypot(e.x-player.x,e.y-player.y)-e.r;if(dd>R)continue;
    let sc;
    if(mode==='far')sc=dd;
    else if(mode==='dense'){sc=0;for(const o of pool)if(o.active&&Math.abs(o.x-e.x)<80&&Math.abs(o.y-e.y)<80)sc++;sc-=dd*.002}
    else sc=-dd;
    if(sc>bs){bs=sc;best=e}
  }
  return best;
}
function addProj(x,y,vx,vy,life,dmg,crit,kb,color,r,k,st,aoe,fz,pierce,ret){ // proyectiles del jugador con pooling
  const q=projFree.pop()||{};q.x=x;q.y=y;q.vx=vx;q.vy=vy;q.life=life;q.l0=life;q.dmg=dmg;q.crit=crit;q.kb=kb;q.color=color;q.r=r;q.k=k;q.st=st;q.aoe=aoe||0;
  q.fz=!!fz;q.pierce=pierce||0;q.ret=!!ret;q.back=false;q.owner='player';
  if(q.pierce>0){if(q.hits)q.hits.clear();else q.hits=new Set()}else q.hits=null;
  projs.push(q);
}
function recycleProj(i){const q=projs[i];projs[i]=projs[projs.length-1];projs.pop();projFree.push(q)}
function explode(q,skip){ // Bazooka: daño en área
  const R=q.aoe;slashes.push({k:'ring',x:q.x,y:q.y-6,t:.28,T:.28,c:q.color,R});burst(q.x,q.y-6,q.color,16,240);shake(5);sfx('boom');
  for(const e of pool)if(e.active&&e!==skip&&Math.hypot(e.x-q.x,e.y-q.y)<R+e.r)hitEnemy(e,Math.round(q.dmg*.7),false,q.kb,Math.atan2(e.y-q.y,e.x-q.x),q.color);
}

function rollDmg(w,d){
  const crit=Math.random()*100<Math.min(stats.critRate+d.crit,CAPS.critRate);
  // daño final = daño base × multiplicador de arma × crit × pasivas × items
  return {crit,dmg:Math.max(1,Math.round((stats.damage/10)*d.damage*RARITY[w.rarity].m*(crit?2:1)*heroDmg()*wb().dmg*mods.passive*mods.item))};
}

const lerpAng=(a,b,t)=>a+Math.atan2(Math.sin(b-a),Math.cos(b-a))*t;
function weaponSlot(i,n,t){ // posición del arma i alrededor del jugador (relativa a él); z=0 → detrás del cuerpo, z=1 → delante
  const phi=n===1?.55:(-Math.PI/2+i*6.2832/n+.35)+Math.sin(t*.7)*.06,rx=20+Math.min(n,7)*1.5,ry=11;
  return {x:Math.cos(phi)*rx,y:Math.sin(phi)*ry,z:Math.sin(phi)>=0?1:0};
}
function weaponGround(w){const n=weapons.length,i=Math.max(0,weapons.indexOf(w)),sl=weaponSlot(i,n,nowS());return {x:player.x+sl.x,y:player.y+sl.y}}
function fireWeapon(w,ang,tg){
  const d=WeaponDB[w.id];sfx(d.type==='melee'?'melee':'shoot');
  const wp=weaponGround(w);if(tg&&d.type!=='melee')ang=Math.atan2(tg.y-wp.y,tg.x-wp.x);
  w.fireA=ang;w.hold=.5;w.kick=1; // animación del arma: apunta y retrocede/embiste
  if(d.type==='melee'){
    const reach=effRange(d),T=w.id==='axe'?.24:.15;
    slashes.push({a:ang,r:reach,arc:d.arc,t:T,T,c:d.color,w:w.id==='axe'?12:8});
    player.atk=.14;player.atkA=ang;player.rec=1;if(w.id==='axe')shake(2);
    for(const e of pool){
      if(!e.active)continue;
      const dx=e.x-player.x,dy=e.y-player.y;
      if(Math.hypot(dx,dy)>reach+e.r)continue;
      let da=Math.atan2(dy,dx)-ang;da=Math.atan2(Math.sin(da),Math.cos(da));
      if(Math.abs(da)<=d.arc/2){const r=rollDmg(w,d);hitEnemy(e,r.dmg,r.crit,d.knockback+stats.knockback,Math.atan2(dy,dx),d.color)}
    }
    return;
  }
  if(d.type==='special'&&d.mode==='beam'){ // Lightning Wand: rayo recto que atraviesa a todos los enemigos de la línea
    const L=effRange(d),ux=Math.cos(ang),uy=Math.sin(ang),sx=weaponGround(w).x,sy=weaponGround(w).y-14;
    for(const e of pool){
      if(!e.active)continue;
      const rx=e.x-player.x,ry=e.y-player.y,t=rx*ux+ry*uy;if(t<0||t>L)continue;
      if(Math.abs(rx*uy-ry*ux)<e.r+14){const r=rollDmg(w,d);hitEnemy(e,r.dmg,r.crit,d.knockback+stats.knockback,ang,d.color)}
    }
    slashes.push({k:'bolt',pts:[{x:sx,y:sy},{x:sx+ux*L*.5+(Math.random()-.5)*12,y:sy+uy*L*.5+(Math.random()-.5)*12},{x:sx+ux*L,y:sy+uy*L}],t:.14,T:.14,c:d.color});
    player.atk=.1;player.atkA=ang;player.rec=-1;return;
  }
  if(d.type==='special'&&d.mode==='slam'){ // Hammer: golpe en área sobre el objetivo
    const R=d.radius||70;slashes.push({k:'ring',x:tg.x,y:tg.y,t:.25,T:.25,c:d.color,R});burst(tg.x,tg.y,d.color,14,230);shake(4);
    for(const e of pool)if(e.active&&Math.hypot(e.x-tg.x,e.y-tg.y)<R+e.r){const r=rollDmg(w,d);hitEnemy(e,r.dmg,r.crit,d.knockback+stats.knockback,Math.atan2(e.y-tg.y,e.x-tg.x),d.color)}
    player.atk=.14;player.atkA=ang;player.rec=1;return;
  }
  if(d.type==='special'){ // Thunder: rayo que salta entre enemigos cercanos
    let cur=tg,from={x:player.x,y:player.y-8};const hit=new Set(),pts=[from];
    for(let i=0;i<4&&cur;i++){
      const r=rollDmg(w,d);hitEnemy(cur,Math.max(1,Math.round(r.dmg*(1-i*.15))),r.crit,d.knockback+stats.knockback,Math.atan2(cur.y-from.y,cur.x-from.x),d.color);
      hit.add(cur);from={x:cur.x,y:cur.y-cur.r*.5};pts.push(from);
      let nx=null,nd=150;for(const e of pool)if(e.active&&!hit.has(e)){const dd=Math.hypot(e.x-cur.x,e.y-cur.y);if(dd<nd){nd=dd;nx=e}}
      cur=nx;
    }
    slashes.push({k:'bolt',pts,t:.14,T:.14,c:d.color});player.atk=.1;player.atkA=ang;player.rec=-1;
    return;
  }
  for(let i=0;i<d.count;i++){
    const off=d.count>1?(i/(d.count-1)-.5)*d.spread*2:(Math.random()-.5)*d.spread;
    const a=ang+off,cos=Math.cos(a),sin=Math.sin(a),r=rollDmg(w,d);
    addProj(wp.x+cos*W_WORLD[w.id].L*.6,wp.y+sin*W_WORLD[w.id].L*.5,cos*d.speed,sin*d.speed,Math.max(.1,effRange(d)/d.speed*(d.ret?2:1)),r.dmg,r.crit,d.knockback+stats.knockback,d.color,5,w.id,d.style,d.aoe,d.freeze,d.pierce,d.ret);
  }
  const mxp=wp.x+Math.cos(ang)*W_WORLD[w.id].L*.65,myp=wp.y-14+Math.sin(ang)*W_WORLD[w.id].L*.5; // fogonazo y cono desde el arma
  slashes.push({k:'flash',x:mxp,y:myp,t:.07,T:.07,c:d.color});
  if(d.count>1)slashes.push({k:'cone',a:ang,arc:d.spread*2,r:110,t:.1,T:.1,c:d.color,x:mxp,y:myp});
  player.atk=.12;player.atkA=ang;player.rec=-1;burst(mxp,myp,d.color,2,110);
}
function updateWeapons(dt){
  for(const w of weapons){
    const des=w.hold>0?w.fireA:player.aim; // cada arma sigue apuntando hacia donde disparó, o al enemigo más cercano
    w.aimA=lerpAng(w.aimA===undefined?des:w.aimA,des,Math.min(1,dt*12));w.hold=Math.max(0,(w.hold||0)-dt);
    w.kick=Math.max(0,(w.kick||0)-dt/(WeaponDB[w.id].type==='melee'?.2:.12));
    w.cd-=dt;
    if(w.cd>0)continue;
    const d=WeaponDB[w.id],tg=pickTarget(d); // cada arma elige su propio objetivo
    if(!tg)continue;
    w.cdMax=w.cd=1/(d.attackSpeed*stats.attackSpeed/100);
    fireWeapon(w,Math.atan2(tg.y-player.y,tg.x-player.x),tg);
  }
  for(let i=slashes.length-1;i>=0;i--)if((slashes[i].t-=dt)<=0)slashes.splice(i,1);
  for(let i=projs.length-1;i>=0;i--){
    const p=projs[i];let dead=false;
    if(p.ret){ // boomerang: sale, vuelve hacia el jugador y puede golpear en ambos tramos
      if(!p.back&&p.life<p.l0*.5){p.back=true;if(p.hits)p.hits.clear()}
      if(p.back){const dx=player.x-p.x,dy=player.y-8-p.y,dd=Math.hypot(dx,dy)||1,sp=Math.hypot(p.vx,p.vy);p.vx=dx/dd*sp;p.vy=dy/dd*sp;if(dd<16)p.life=0}
    }
    if(p.st==='magic'&&fx.length<200&&Math.random()<dt*30)fx.push({x:p.x,y:p.y-10,vx:(Math.random()-.5)*30,vy:(Math.random()-.5)*30,t:.3,c:p.color,s:2});
    for(let k=0;k<3&&!dead;k++){ // 3 subpasos para no atravesar enemigos
      p.x+=p.vx*dt/3;p.y+=p.vy*dt/3;
      for(const o of obstacles)if(Math.hypot(p.x-o.x,p.y-o.y)<o.r+p.r){dead=true;break}
      if(dead)break;
      for(const e of pool)if(e.active&&!(p.hits&&p.hits.has(e))&&Math.hypot(p.x-e.x,p.y-e.y)<e.r+p.r){hitEnemy(e,p.dmg,p.crit,p.kb,Math.atan2(p.vy,p.vx),p.color);if(p.fz)e.slow=1.6;if(p.aoe)explode(p,e);if(p.hits)p.hits.add(e);if(p.pierce>0)p.pierce--;else dead=true;break}
    }
    p.life-=dt;
    if(p.x<0||p.y<0||p.x>W||p.y>H)dead=true;
    if(p.aoe&&!dead&&p.life<=0)explode(p,null);
    if(dead||p.life<=0)recycleProj(i);
  }
}
function updateTowers(dt){ // torres: potencia ofensiva extra, escala con Engineering
  if(!TOWERS){turrets.length=0;return}
  while(turrets.length<TOWERS)turrets.push({cd:Math.random()*.6,x:player.x,y:player.y});
  turrets.length=TOWERS;const t=nowS();
  for(let i=0;i<TOWERS;i++){
    const tw=turrets[i],a=t*1.3+i*6.283/TOWERS;
    tw.x=player.x+Math.cos(a)*50;tw.y=player.y-6+Math.sin(a)*30;tw.cd-=dt;
    if(tw.cd>0)continue;
    let best=null,bd=380;
    for(const e of pool){if(!e.active)continue;const dd=Math.hypot(e.x-tw.x,e.y-tw.y)-e.r;if(dd<bd){bd=dd;best=e}}
    if(!best)continue;
    tw.cd=.8;const a2=Math.atan2(best.y-tw.y,best.x-tw.x),dmg=Math.max(1,Math.round((5+stats.engineering*1.6)*(stats.damage/10)*wb().dmg));
    addProj(tw.x,tw.y-8,Math.cos(a2)*800,Math.sin(a2)*800,.55,dmg,false,3,'#9ef',4,'tower','bullet',0);
  }
}

const mergePartner=i=>{
  const x=weapons[i];
  return x.rarity<=MAX_MERGE?weapons.findIndex((y,j)=>j!==i&&y.id===x.id&&y.rarity===x.rarity):-1;
};
function mergeWeapon(i){
  const j=mergePartner(i);if(j<0)return;
  const a=Math.min(i,j),b=Math.max(i,j);
  weapons[a].rarity++;weapons[a].value+=weapons[b].value;weapons[a].cd=0;

}

function beep(f,d,type,vol,slide,delay){
  if(!AC||camp.vol<=0)return;
  const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime((vol||.1)*camp.vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);
}

function updateWorld(dt){
  game.timeLeft-=dt;game.score+=dt;
  spawnDirector(dt);
  for(let i=spawnMarks.length-1;i>=0;i--){const m=spawnMarks[i];if((m.t-=dt)<=0){spawnEnemy(m.type,m.elite,m.x,m.y);spawnMarks.splice(i,1)}}
  if(shouldEndWave()){endWave();return}
  if(!game.bossSpawned&&curWave.boss&&curWave.duration-game.timeLeft>=curWave.duration*.25&&spawnBoss(curWave.boss))game.bossSpawned=true; // el jefe entra durante la wave
  game.atkCD-=dt;game.hitFlash=Math.max(0,game.hitFlash-dt);
  if(hero.id==='ignis'){ // Ignis: pulso de fuego periódico
    game.fireT-=dt;game.pulse=Math.max(0,game.pulse-dt);
    if(game.fireT<=0){
      game.fireT=1.2;game.pulse=.3;
      const fd=Math.max(1,Math.round(8*(stats.damage/10)));
      for(const e of pool)if(e.active&&Math.hypot(e.x-player.x,e.y-player.y)<130+e.r)hitEnemy(e,fd,false,-15,0);
    }
  }
  updateWeapons(dt);updateTowers(dt);
  const act=pool.filter(e=>e.active),f=Math.pow(.0005,dt);
  for(const e of act){
    const dx=player.x-e.x,dy=player.y-e.y,dist=Math.hypot(dx,dy)||1;
    let dir=1,px=0,py=0;
    if(e.boss)dir=bossAI(e,dt,dx,dy,dist);
    else if(e.behavior==='ranged'){ // mantiene distancia, se desplaza de costado y dispara
      dir=dist<e.range*.7?(BAL.rangedHold?0:.4):1; // los ranged avanzan: nunca retroceden
    }else if(e.behavior==='lunge'){ // embiste de golpe (comportamiento ya existente)
      e.lt-=dt;
      if(e.lunge>0){e.lunge-=dt;dir=2.4}else if(e.lt<=0&&dist<260){e.lt=2.5+Math.random()*2;e.lunge=.35;startAttack(e,.35)}
    }else if(e.type==='swarmer'){const w=Math.sin(e.age*9+e.x*.05)*.7;px=-dy/dist*w;py=dx/dist*w}
    else if(e.type==='brute'){e.st2-=dt;if(e.st2<=0&&dist<320){e.st2=.6;shake(1.5);burst(e.x,e.y+e.r*.6,'#7a6a4a',3,70)}}
    const spd=e.moveSpeed*(e.slow>0?.45:1);if(e.slow>0)e.slow-=dt;
    e.x+=(dx/dist*spd*dir+px*spd+e.kx)*dt;e.y+=(dy/dist*spd*dir+py*spd+e.ky)*dt;
    e.mv=Math.abs(dx/dist*spd*dir+px*spd)+Math.abs(dy/dist*spd*dir+py*spd)>3; // ¿se está desplazando? decide caminar o reposo
    if(e.atkT>0)e.atkT-=dt;if(e.hitT>0)e.hitT-=dt;
    if(e.shots&&!e.boss)enemyFire(e,dt,dx,dy,dist);
    e.age=(e.age||0)+dt;e.kx*=f;e.ky*=f;e.flash=Math.max(0,e.flash-dt);e.cd-=dt;
    e.x=Math.max(e.r,Math.min(W-e.r,e.x));e.y=Math.max(e.r,Math.min(H-e.r,e.y));
    pushOut(e,{x:player.x,y:player.y,r:player.r*.7}); // no se montan sobre el jugador
    for(const o of obstacles)pushOut(e,o);
    if(dist<e.r+player.r+2&&e.cd<=0){e.cd=e.attackCooldown;startAttack(e,ATK_T);hurtPlayer(e.damage)}
  }
  act.sort((a,b)=>a.x-b.x); // separación por barrido: evita O(n²) y que se apilen en un punto
  for(let i=0;i<act.length;i++){
    const a=act[i];if(!a.active)continue;
    for(let j=i+1;j<act.length;j++){
      const b=act[j];if(b.x-a.x>a.r+b.r+40)break;if(!b.active)continue;
      let ax=a.x-b.x,ay=a.y-b.y,ad=Math.hypot(ax,ay);const m=a.r+b.r;
      if(ad<m){
        if(ad<.5){ax=Math.random()-.5;ay=Math.random()-.5;ad=Math.hypot(ax,ay)||1}
        const p=(m-ad),wa=a.boss?.1:b.boss?.9:.5,wb=1-wa;
        a.x+=ax/ad*p*wa;a.y+=ay/ad*p*wa;b.x-=ax/ad*p*wb;b.y-=ay/ad*p*wb;
      }
    }
  }
  for(let i=dying.length-1;i>=0;i--)if((dying[i].t-=dt)<=0)dying.splice(i,1);
  if(curWave.number===30&&game.bossSpawned&&hazards.length<14){ // wave final: lluvia de zonas de daño
    game.hz=(game.hz||0)-dt;
    if(game.hz<=0){game.hz=1.7;hazards.push({x:Math.max(80,Math.min(W-80,player.x+(Math.random()-.5)*520)),y:Math.max(80,Math.min(H-80,player.y+(Math.random()-.5)*520)),r:75,t:1.1,T:1.1,dmg:18,src:'Meteoro'})}
  }
  for(let i=hazards.length-1;i>=0;i--){
    const h=hazards[i];h.t-=dt;
    if(h.t<=0){sfx('boom');shake(5);
      if(Math.hypot(h.x-player.x,h.y-player.y)<h.r+player.r)hurtPlayer(h.dmg,h.src);
      for(let k=0;k<10;k++){const a=Math.random()*6.283;fx.push({x:h.x,y:h.y,vx:Math.cos(a)*140,vy:Math.sin(a)*140,t:.35,c:'#c9473b'})}
      hazards.splice(i,1);
    }
  }
  for(let i=fx.length-1;i>=0;i--){const q=fx[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.95;q.vy*=.95;if((q.t-=dt)<=0)fx.splice(i,1)}
  for(let i=eprojs.length-1;i>=0;i--){
    const p=eprojs[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;
    let dead=p.life<=0||p.x<0||p.y<0||p.x>W||p.y>H;
    if(!dead&&Math.hypot(p.x-player.x,p.y-player.y)<player.r+4){hurtPlayer(p.dmg,p.src);dead=true}
    if(!dead)for(const o of obstacles)if(Math.hypot(p.x-o.x,p.y-o.y)<o.r+4){dead=true;break}
    if(dead){eprojFree.push(p);eprojs[i]=eprojs[eprojs.length-1];eprojs.pop()}
  }
  collectPickups(dt,false);
  for(let i=texts.length-1;i>=0;i--){const t=texts[i];t.t-=dt;t.y-=30*dt;if(t.t<=0)texts.splice(i,1)}
}

  Object.assign(game,{gold:0,score:0,kills:0,goldEarned:0,cleared:0,dead:false,hitFlash:0,atkCD:0,xp:0,lvl:0,lost:false,deathAt:0});shop.items.length=0;
  for(const e of pool)e.active=false;

  }

function drawHeroSprite(x,y,o){ // protagonista: encapuchado carmesí (sprite) con idle, caminata, golpe y ataque
  const sc=o.sc||1,t=nowS(),H=46*sc,aim=o.aim||0,face=Math.cos(aim)>=0?1:-1,sp=Math.min(1,Math.hypot(o.vx||0,o.vy||0)/200);
  const atk=o.atk>0?o.atk/.13:0,hit=o.hit>0,fy=y+7*sc;
  const bob=sp>.1?Math.abs(Math.sin(t*11))*3*sc:Math.sin(t*2.6)*1.2*sc,tilt=sp>.1?Math.sin(t*11)*.07:0;
  shadow(x,fy,13*sc,4.5*sc);
  const ready=heroImg&&heroImg.complete&&heroImg.naturalWidth;
  if(ready){
    const Wd=H*heroImg.naturalWidth/heroImg.naturalHeight,on=atk>0&&o.atkA!==undefined;
    const lx=on?Math.cos(o.atkA)*(o.rec||1)*4*atk*sc:0,ly=on?Math.sin(o.atkA)*(o.rec||1)*3*atk*sc:0;
    const dd=o.dead||0;ctx.save();ctx.translate(x+lx+(hit?(Math.random()-.5)*4:0),fy-bob+ly);ctx.rotate(tilt+Math.min(1.45,dd*2.5)*face);if(dd)ctx.globalAlpha=Math.max(.2,1-dd*.6);ctx.scale(face*(1+atk*.05),1-atk*.04);
    ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
    ctx.drawImage(heroImg,-Wd/2,-H,Wd,H);
    if(hit&&heroWhite&&heroWhite.width){ctx.globalAlpha=.75;ctx.drawImage(heroWhite,-Wd/2,-H,Wd,H);ctx.globalAlpha=1}
    ctx.restore();
  }else{ctx.fillStyle='#8a1220';ctx.beginPath();ctx.ellipse(x,fy-18*sc,10*sc,16*sc,0,0,7);ctx.fill()}
}

function drawWeapons(layer){ // cantidad de armas compradas = cantidad de armas visibles alrededor del jugador
  if(game.lost||game.phase==='camp')return;
  const n=weapons.length,t=nowS(),mv=Math.min(1,Math.hypot(player.vx||0,player.vy||0)/200);
  ctx.imageSmoothingEnabled=false; // pixel art nítido
  for(let i=0;i<n;i++){
    const w=weapons[i],cfg=W_WORLD[w.id],im=WIMG[w.id],melee=WeaponDB[w.id].type==='melee';
    if(!cfg||!im||!im.complete||!im.naturalWidth)continue;
    const sl=weaponSlot(i,n,t);if(sl.z!==layer)continue;
    const A=w.aimA===undefined?player.aim:w.aimA,flip=Math.cos(A)<0,a0=flip?Math.PI-cfg.a0:cfg.a0,k=w.kick||0;
    let rot=A-a0;if(cfg.spin)rot=t*8*cfg.spin+i*1.7;
    const bob=Math.sin(t*(mv>.1?11:2.4)+i*1.3)*(mv>.1?1.8:1.1),push=melee?k*10:-k*5; // melee: estocada; a distancia: retroceso
    if(melee&&!cfg.spin)rot+=k*1.2*(flip?-1:1);
    const sc=cfg.L/Math.max(im.naturalWidth,im.naturalHeight),W=im.naturalWidth*sc,H=im.naturalHeight*sc;
    ctx.save();ctx.translate(player.x+sl.x+Math.cos(A)*push,player.y-14+sl.y+bob+Math.sin(A)*push*.6);ctx.rotate(rot);ctx.scale(flip?-1:1,1);
    ctx.drawImage(im,-W/2,-H/2,W,H);ctx.restore();
  }
}
function ghostPath(t,lean){ // capa espectral con borde deshilachado
  ctx.beginPath();ctx.moveTo(-10+lean,-12);
  ctx.quadraticCurveTo(-13+lean,-30,lean*1.5,-31);ctx.quadraticCurveTo(13+lean*2,-30,10+lean,-12);
  ctx.lineTo(13,6);
  for(let i=0;i<=6;i++)ctx.lineTo(13-i*26/6+Math.sin(t*4+i)*1.5,13+Math.sin(t*5+i*1.7)*3+(i%2?5:0));
  ctx.lineTo(-13,6);ctx.closePath();
}
function drawGhost(x,y,o){ // protagonista original: espectro negro y rojo, dibujado con Canvas
  const t=nowS(),sc=o.sc||1,fl=Math.sin(t*2.6)*3,lean=(o.vx||0)/220*6,hit=o.hit>0,atk=o.atk>0?o.atk/.13:0,aim=o.aim||0,look=Math.cos(aim);
  ctx.fillStyle='rgba(0,0,0,'+(.32-fl*.02)+')';ctx.beginPath();ctx.ellipse(x,y+11*sc,(13-fl*.5)*sc,(4.5-fl*.2)*sc,0,0,7);ctx.fill();

  ctx.fillStyle=g0;ctx.fillRect(x-50*sc,y-60*sc,100*sc,100*sc);
  ctx.save();
  const on=atk>0&&o.atkA!==undefined,lx=on?Math.cos(o.atkA)*(o.rec||1)*4*atk:0,ly=on?Math.sin(o.atkA)*(o.rec||1)*3*atk:0;
  ctx.translate(x+lx*sc+(hit?(Math.random()-.5)*5:0),y-6*sc+(fl+ly)*sc);ctx.scale(sc*(1+atk*.06),sc*(1-atk*.04));
  const g=ctx.createLinearGradient(0,-31,0,17);g.addColorStop(0,'#1b0a10');g.addColorStop(.55,'#2d0b12');g.addColorStop(1,'rgba(120,16,28,.15)');
  ghostPath(t,lean);ctx.fillStyle=g;ctx.fill();
  ctx.strokeStyle='#7a1018';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(-10+lean,-12);ctx.quadraticCurveTo(-13+lean,-30,lean*1.5,-31);ctx.quadraticCurveTo(13+lean*2,-30,10+lean,-12);ctx.stroke();
  ctx.strokeStyle='#b0182a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-9,-6);ctx.quadraticCurveTo(0,-1,9,-8);ctx.stroke();
  ctx.fillStyle='#c0222e';ctx.fillRect(-4,1,2,2);ctx.fillRect(3,4,2,2);ctx.fillRect(-1,8,2,2);
  const fx0=lean*1.5+look*1.5;
  ctx.fillStyle='#040102';ctx.beginPath();ctx.ellipse(fx0,-21,6.5,7.5,0,0,7);ctx.fill();
  ctx.shadowColor='#ff2020';ctx.shadowBlur=hit?0:8+atk*6;ctx.fillStyle=hit?'#fff':'#ff2a2a';
  for(const d of [-2.6,2.6]){ctx.beginPath();ctx.ellipse(fx0+d+look*1.2,-21,1.8,2.6+atk,0,0,7);ctx.fill()}

  ctx.fillStyle='#e0303c';ctx.beginPath();ctx.arc(hx+Math.cos(aim)*4,hy+Math.sin(aim)*3,2+atk*1.5,0,7);ctx.fill();
  if(hit){ghostPath(t,lean);ctx.fillStyle='rgba(255,255,255,.75)';ctx.fill()}
  ctx.restore();
}

function frame(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;
  if(DBG.on&&(DBG.t=(DBG.t||0)-dt)<=0){DBG.t=.25;const c=curWave;document.getElementById('dbg').textContent=
    'FPS '+Math.round(1/PERF.ema)+'  perf x'+PERF.scale.toFixed(2)+'\nwave '+c.number+'  timer '+Math.ceil(game.timeLeft)+'\nenemigos '+(game.alive|0)+' / objetivo '+(game.target|0)+'\nintervalo '+c.intMin.toFixed(2)+'-'+c.intMax.toFixed(2)+'  mult x'+D.mult.toFixed(2)+'\njefe '+(pool.some(e=>e.active&&e.boss)?'activo':'no')+'\nproyectiles '+projs.length+' / enemigos '+eprojs.length+'\ndrops '+coins.length}
  PERF.ema+=(dt-PERF.ema)*.05;PERF.scale=Math.max(.55,Math.min(1,1-(PERF.ema-.024)*30)); // si baja el FPS, baja la población objetivo
  game.surge=Math.max(0,(game.surge||0)-dt);
  shk.a=Math.max(0,shk.a-dt*40);game.vig=Math.max(0,(game.vig||0)-dt);
  if(game.phase==='wave'&&!state.paused)game.banner=Math.max(0,(game.banner||0)-dt);
  if(!state.paused){if(!game.dead&&game.phase==='wave'){update(dt);updateWorld(dt);state.time+=dt}else if(!game.dead&&game.phase==='clear'){update(dt);updateClear(dt);state.time+=dt}}
  if(game.phase==='camp')drawCamp();else draw();hud();requestAnimationFrame(frame);
}
function togglePause(){if(game.phase!=='wave'||game.dead)return;state.paused=!state.paused;document.getElementById('pause').classList.toggle('on',state.paused)}
addEventListener('pointerdown',audioInit);
showCamp();
requestAnimationFrame(frame);
</script>
